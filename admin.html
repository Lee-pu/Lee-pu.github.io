<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Leepu 관리</title>
<link rel="icon" type="image/svg+xml" href="assets/admin-icon.svg">
<link rel="apple-touch-icon" href="assets/admin-icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --accent: #E5007E;
  --accent-ink: #ffffff;
  --bg: #faf8f9;
  --surface: #ffffff;
  --fg: #1d1a1c;
  --muted: #6f6970;
  --line: #ece6ea;
  --chip: #f3eef1;
  --ok-bg: #e4f6ec;
  --ok-fg: #17663f;
  --warn-bg: #fff3dc;
  --warn-fg: #8a5a00;
  --bad-bg: #fde8ea;
  --bad-fg: #b3261e;
  --font: "Inter","Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme: light
}
@media (prefers-color-scheme:dark) {
  :root:not([data-theme=light]) {
    --bg: #141113;
    --surface: #1d191c;
    --fg: #f2edf0;
    --muted: #a39aa1;
    --line: #2e282c;
    --chip: #2a2428;
    --ok-bg: #143323;
    --ok-fg: #8fe0b2;
    --warn-bg: #3a2c10;
    --warn-fg: #f3c56b;
    --bad-bg: #3d1719;
    --bad-fg: #ff9d95;
    color-scheme: dark
  }
}
:root[data-theme=dark] {
  --bg: #141113;
  --surface: #1d191c;
  --fg: #f2edf0;
  --muted: #a39aa1;
  --line: #2e282c;
  --chip: #2a2428;
  --ok-bg: #143323;
  --ok-fg: #8fe0b2;
  --warn-bg: #3a2c10;
  --warn-fg: #f3c56b;
  --bad-bg: #3d1719;
  --bad-fg: #ff9d95;
  color-scheme: dark
}
* {
  box-sizing: border-box
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 14px/1.55 var(--font)
}
img {
  max-width: 100%;
  display: block
}
a {
  color: inherit
}
button,
input,
select,
textarea {
  font: inherit;
  color: inherit
}
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px
}
[hidden] {
  display: none!important
}
.wrap {
  max-width: 1100px;
  margin: 0 auto;
  padding-left: max(16px,env(safe-area-inset-left,0px));
  padding-right: max(16px,env(safe-area-inset-right,0px))
}
header {
  position: sticky;
  top: env(safe-area-inset-top,0);
  z-index: 5;
  background: var(--surface);
  border-bottom: 1px solid var(--line)
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top,0);
  z-index: 10;
  background: var(--surface)
}
header .wrap {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  padding-block: 10px
}
.brand {
  font-weight: 800;
  font-size: 17px;
  letter-spacing: -.02em
}
.brand small {
  font-weight: 600;
  font-size: 12px;
  color: var(--accent);
  margin-left: 6px
}
.tabs {
  display: flex;
  gap: 4px
}
.tab {
  appearance: none;
  border: 0;
  background: 0 0;
  padding: 8px 12px;
  border-radius: 8px;
  font-weight: 600;
  color: var(--muted);
  cursor: pointer
}
.tab[aria-selected=true] {
  background: var(--chip);
  color: var(--fg)
}
.right {
  margin-left: auto;
  display: flex;
  gap: 8px;
  align-items: center
}
main.wrap {
  padding-block: 24px 80px
}
h1 {
  font-size: 22px;
  margin: 0;
  letter-spacing: -.02em
}
.head {
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
  margin-bottom: 16px
}
.sub {
  color: var(--muted);
  margin: 4px 0 0
}
.btn {
  appearance: none;
  display: inline-flex;
  gap: 6px;
  align-items: center;
  justify-content: center;
  height: 38px;
  padding: 0 14px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--surface);
  font-weight: 600;
  cursor: pointer;
  text-decoration: none;
  white-space: nowrap
}
.btn:hover {
  border-color: var(--accent)
}
.btn.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink)
}
.btn.danger {
  color: var(--bad-fg)
}
.btn.sm {
  height: 30px;
  padding: 0 10px;
  font-size: 12.5px;
  border-radius: 8px
}
.btn:disabled {
  opacity: .5;
  cursor: wait
}
.field {
  width: 100%;
  min-height: 40px;
  padding: 8px 12px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--surface)
}
textarea.field {
  resize: vertical
}
.lbl,
label.lbl {
  display: block;
  font-weight: 600;
  margin-bottom: 6px
}
.hint {
  font-size: 12px;
  color: var(--muted);
  margin-top: 4px
}
.stack {
  display: grid;
  gap: 16px
}
.two {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px
}
@media (max-width:560px) {
  .two {
    grid-template-columns: 1fr
  }
}
.search {
  max-width: 280px
}
.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 20px
}
.list {
  display: grid;
  gap: 8px
}
.row {
  display: grid;
  grid-template-columns: 96px 1fr auto;
  gap: 14px;
  align-items: center;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 8px
}
.row .th {
  width: 96px;
  aspect-ratio: 16/9;
  max-width: 100%;
  border-radius: 8px;
  overflow: hidden;
  background: var(--chip)
}
.row .th img {
  width: 100%;
  height: 100%;
  object-fit: cover
}
.row .t {
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap
}
.row .m {
  font-size: 12px;
  color: var(--muted);
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  align-items: center;
  margin-top: 2px
}
.row .acts {
  display: flex;
  gap: 6px
}
.row.sel {
  grid-template-columns: auto 96px 1fr auto
}
@media (max-width:560px) {
  .row {
    grid-template-columns: 72px 1fr
  }
  .row.sel {
    grid-template-columns: auto 72px 1fr
  }
  .row .th {
    width: 72px
  }
  .row .acts {
    grid-column: 1/-1;
    justify-content: flex-end
  }
}
.min0 {
  min-width: 0
}
.pill {
  font-size: 11px;
  font-weight: 600;
  padding: 1px 8px;
  border-radius: 999px;
  background: var(--chip);
  color: var(--fg)
}
.pill.ok {
  background: var(--ok-bg);
  color: var(--ok-fg)
}
.pill.warn {
  background: var(--warn-bg);
  color: var(--warn-fg)
}
.pill.bad {
  background: var(--bad-bg);
  color: var(--bad-fg)
}
.cat {
  color: var(--accent);
  font-weight: 700;
  font-size: 11px;
  letter-spacing: .03em
}
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px
}
.chip {
  appearance: none;
  border: 1px solid var(--line);
  background: var(--surface);
  padding: 4px 12px;
  border-radius: 999px;
  font-size: 12.5px;
  cursor: pointer;
  color: var(--muted)
}
.chip[aria-pressed=true] {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink)
}
.tag {
  display: inline-flex;
  gap: 6px;
  align-items: center;
  font-size: 12.5px;
  padding: 3px 6px 3px 10px;
  border-radius: 999px;
  background: var(--chip)
}
.tag button {
  border: 0;
  background: 0 0;
  cursor: pointer;
  color: var(--muted);
  padding: 0 2px
}
.inline {
  display: flex;
  gap: 8px
}
.inline .field {
  flex: 1;
  min-width: 0
}
.thumbs {
  display: flex;
  flex-wrap: wrap;
  gap: 8px
}
.thumbs .one {
  position: relative;
  width: 96px;
  height: 64px;
  border-radius: 8px;
  overflow: hidden;
  background: var(--chip)
}
.thumbs .one img {
  width: 100%;
  height: 100%;
  object-fit: cover
}
.thumbs .one button {
  position: absolute;
  top: 3px;
  right: 3px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  border: 0;
  background: rgba(0,0,0,.65);
  color: #fff;
  cursor: pointer;
  font-size: 12px;
  line-height: 1
}
.thumbs .one[data-star] {
  cursor: pointer
}
.thumbs .one .st {
  left: 3px;
  right: auto;
  font-size: 11px;
  color: rgba(255,255,255,.75)
}
.thumbs .one.star {
  outline: 2px solid var(--accent,#ff3d8b);
  outline-offset: 2px
}
.thumbs .one.star .st {
  color: #fff;
  background: var(--accent,#ff3d8b)
}
.thumbs .one .note {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 2px 4px;
  background: rgba(0,0,0,.6);
  color: #fff;
  font-size: 10px;
  text-align: center
}
.vid {
  display: flex;
  gap: 8px;
  align-items: center;
  font-size: 12.5px;
  background: var(--chip);
  padding: 6px 10px;
  border-radius: 8px
}
.vid span {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap
}
.switch {
  display: inline-flex;
  gap: 10px;
  align-items: center;
  cursor: pointer;
  font-weight: 600
}
.switch input {
  width: 18px;
  height: 18px;
  accent-color: var(--accent)
}
dialog {
  border: 0;
  padding: 0;
  border-radius: 18px;
  width: min(640px,calc(100vw - 24px));
  max-height: calc(100vh - 32px);
  background: var(--surface);
  color: var(--fg);
  box-shadow: 0 30px 80px -20px rgba(0,0,0,.5)
}
dialog::backdrop {
  background: rgba(10,5,8,.55)
}
.dlg {
  padding: 22px;
  display: grid;
  gap: 16px
}
.dlg h2 {
  margin: 0;
  font-size: 18px
}
.foot {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  padding-top: 4px
}
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(20px + env(safe-area-inset-bottom,0px));
  transform: translateX(-50%);
  z-index: 50;
  background: var(--fg);
  color: var(--bg);
  padding: 10px 16px;
  border-radius: 12px;
  font-size: 13px;
  max-width: calc(100vw - 32px);
  box-shadow: 0 10px 30px -10px rgba(0,0,0,.4)
}
.toast.bad {
  background: var(--bad-fg);
  color: #fff
}
.busy {
  width: auto;
  background: 0 0;
  box-shadow: none;
  overflow: visible
}
.busy::backdrop {
  background: color-mix(in srgb,var(--bg) 55%,transparent)
}
.busy div {
  background: var(--surface);
  border: 1px solid var(--line);
  padding: 16px 20px;
  border-radius: 14px;
  font-weight: 600;
  box-shadow: 0 10px 30px -10px rgba(0,0,0,.3)
}
.empty {
  color: var(--muted);
  text-align: center;
  padding: 40px 0
}
ol.steps {
  margin: 0;
  padding-left: 20px;
  display: grid;
  gap: 6px;
  color: var(--muted)
}
ol.steps b {
  color: var(--fg)
}
.am-bar {
  position: sticky;
  top: 58px;
  z-index: 4;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin: 4px 0 14px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--surface)
}
.am-sec summary {
  cursor: pointer;
  list-style: none
}
.am-sec summary::-webkit-details-marker {
  display: none
}
.am-sec summary h2 {
  display: inline;
  margin: 0;
  font-size: 16px
}
.am-sec summary::after {
  content: "+";
  float: right;
  color: var(--accent);
  font-weight: 700
}
.am-sec[open] summary::after {
  content: "−"
}
.am-card {
  display: grid;
  grid-template-columns: 140px minmax(0,1fr);
  gap: 14px;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--bg)
}
.am-card.one-col {
  grid-template-columns: minmax(0,1fr);
  gap: 10px
}
.am-card.sub {
  background: var(--surface)
}
.am-media {
  display: flex;
  flex-direction: column;
  gap: 8px
}
.am-th {
  aspect-ratio: 1/1;
  border-radius: 12px;
  overflow: hidden;
  background: var(--chip)
}
.am-th.round {
  border-radius: 50%
}
.am-th img,
.am-th video {
  width: 100%;
  height: 100%;
  object-fit: cover
}
.am-item {
  display: grid;
  grid-template-columns: minmax(0,1fr) 96px 110px auto auto;
  gap: 6px;
  align-items: center
}
.am-filter {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap
}
.am-foot {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 8px
}
.am-ord {
  display: inline-flex;
  gap: 4px
}
@media (max-width:640px) {
  .am-card {
    grid-template-columns: minmax(0,1fr)
  }
  .am-media {
    flex-direction: row;
    align-items: center
  }
  .am-th {
    width: 96px
  }
  .am-item {
    grid-template-columns: 1fr 1fr;
    padding-bottom: 8px;
    border-bottom: 1px dashed var(--line)
  }
  .am-item > :first-child {
    grid-column: 1/-1
  }
}
</style>
</head>
<body>
<header><div class="wrap">
  <span class="brand" id="brand">Leepu<small>관리</small></span>
  <nav class="tabs" role="tablist" id="tabs" hidden>
    <button class="tab" role="tab" data-tab="works">작업물</button>
    <button class="tab" role="tab" data-tab="items">아이템</button>
    <button class="tab" role="tab" data-tab="artmug">아트머그</button>
    <button class="tab" role="tab" data-tab="settings">설정</button>
  </nav>
  <div class="right"><span class="pill warn" id="h-dirty" hidden>저장 안 한 변경 있음</span><button class="btn sm primary" id="h-export" hidden>data.json 저장</button><button class="btn sm" id="h-view">사이트 보기</button></div>
</div></header>
<main class="wrap" id="page"></main>
<dialog id="dlg"></dialog>
<dialog class="busy" id="busy"><div id="busy-t">저장하는 중…</div></dialog>

<script>
(() => {
  "use strict";
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, (c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[c])));
  const list = v => (Array.isArray(v) ? v : String(v || "").split(",")).map((x => String(x).trim())).filter(Boolean);
  const ko = (a, b) => a.localeCompare(b, "ko");
  const uid = () => Math.random().toString(16).slice(2, 12);
  const today = () => {
    const d = new Date;
    return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
  };
  const ytId = u => ((u || "").match(/(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([\w-]{6,})/) || [])[1] || "";
  const boothId = u => /booth\.pm/i.test(u || "") && (u.match(/\/items\/(\d+)/) || [])[1] || "";
  const KEY = "leepu-admin";
  const store = {
    get() {
      try {
        return JSON.parse(localStorage.getItem(KEY)) || null;
      } catch (e) {
        return null;
      }
    },
    set(v) {
      try {
        localStorage.setItem(KEY, JSON.stringify(v));
      } catch (e) {}
    },
    clear() {
      try {
        localStorage.removeItem(KEY);
      } catch (e) {}
    }
  };
  function guess() {
    const h = location.hostname.match(/^([\w-]+)\.github\.io$/i), seg = location.pathname.split("/").filter(Boolean)[0];
    if (!h) return {
      owner: "",
      repo: "",
      branch: "main",
      token: ""
    };
    return {
      owner: h[1],
      repo: seg && !seg.endsWith(".html") ? seg : `${h[1]}.github.io`,
      branch: "main",
      token: ""
    };
  }
  let C = store.get() || guess();
  {
    const g = guess();
    if (C.owner && g.owner && C.owner.toLowerCase() === g.owner.toLowerCase() && g.repo.toLowerCase() === `${g.owner}.github.io`.toLowerCase() && C.repo !== g.repo && /^leepu$/i.test(C.repo)) {
      C = {
        ...C,
        repo: g.repo
      };
      store.set(C);
    }
  }
  let D = null, tab = "works", F = {}, UP = {}, PREV = {}, LOCAL = false, DIRTY = false;
  const SEL = new Set;
  const LKEY = "leepu-local-data";
  const W = {
    q: "",
    cat: ""
  }, I = {
    q: "",
    cat: "",
    av: ""
  };
  const R = () => `/repos/${C.owner}/${C.repo}`;
  async function api(path, opt = {}) {
    const headers = {
      Authorization: `Bearer ${C.token}`,
      Accept: opt.accept || "application/vnd.github+json",
      "X-GitHub-Api-Version": "2022-11-28"
    };
    if (opt.body) headers["Content-Type"] = "application/json";
    const r = await fetch("https://api.github.com" + path, {
      method: opt.method || "GET",
      headers: headers,
      body: opt.body ? JSON.stringify(opt.body) : undefined,
      cache: "no-store"
    });
    if (!r.ok) {
      let m = "";
      try {
        m = (await r.json()).message || "";
      } catch (e) {}
      const e = new Error(r.status === 401 ? "토큰이 맞지 않거나 만료됐어요. 설정에서 다시 연결해 주세요." : r.status === 403 ? "토큰에 이 저장소를 고칠 권한이 없어요 (Contents: Read and write 필요)." : r.status === 404 ? "저장소나 파일을 찾지 못했어요. 아이디·저장소 이름과 토큰의 저장소 선택을 확인해 주세요." : `GitHub 오류 ${r.status}: ${m}`);
      e.status = r.status;
      throw e;
    }
    return opt.raw ? r.text() : r.status === 204 ? null : r.json();
  }
  const headSha = async () => (await api(`${R()}/git/ref/heads/${C.branch}`)).object.sha;
  const readData = async ref => JSON.parse(await api(`${R()}/contents/data.json?ref=${ref}`, {
    accept: "application/vnd.github.raw",
    raw: true
  }));
  function normalize(d) {
    d.site = d.site || {};
    d.works = d.works || [];
    d.items = d.items || [];
    [ ...d.works, ...d.items ].forEach((x => {
      if (!x.id) x.id = uid();
    }));
    return d;
  }
  async function commit(message, op, files = []) {
    if (LOCAL) {
      op(D);
      localSave();
      return true;
    }
    busy("파일 올리는 중…");
    try {
      const blobs = [];
      for (const f of files) {
        const b = await api(`${R()}/git/blobs`, {
          method: "POST",
          body: {
            content: f.b64,
            encoding: "base64"
          }
        });
        blobs.push({
          path: f.path,
          mode: "100644",
          type: "blob",
          sha: b.sha
        });
      }
      busy("저장하는 중…");
      for (let a = 0; a < 4; a++) {
        const head = await headSha();
        const c = await api(`${R()}/git/commits/${head}`);
        const data = normalize(await readData(head));
        op(data);
        const tree = await api(`${R()}/git/trees`, {
          method: "POST",
          body: {
            base_tree: c.tree.sha,
            tree: [ ...blobs, {
              path: "data.json",
              mode: "100644",
              type: "blob",
              content: JSON.stringify(data, null, 1) + "\n"
            } ]
          }
        });
        const nc = await api(`${R()}/git/commits`, {
          method: "POST",
          body: {
            message: message,
            tree: tree.sha,
            parents: [ head ]
          }

      $("dlg").close();
      toast(need ? LOCAL ? "등록했어요. 이름·썸네일은 GitHub에 올린 뒤 자동으로 채워져요." : "등록했어요. BOOTH 정보는 1분쯤 뒤에 채워져요." : savedMsg());
      itemsView();
    }));
  }
  function settingsView() {
    const s = D.site;
    UP = {};
    F = {
      profile_image: s.profile_image || "",
      tools: [ ...s.tools || [] ],
      links: (s.links || []).map((l => ({
        ...l
      }))),
      fields: [ ...s.fields || [ "3D", "시네머신", "디자인", "영상 편집" ] ]
    };
    const sec = (t, d) => `<div style="margin-top:6px"><h2 style="margin:0;font-size:16px">${t}</h2>${d ? `<p class="sub" style="margin:2px 0 0">${d}</p>` : ""}</div>`;
    $("page").innerHTML = `<div class="stack" style="max-width:640px">\n    <div><h1>설정</h1><p class="sub">사이트에 보이는 순서대로 모아 뒀어요. 다 고친 뒤 맨 아래 <b>저장</b>을 눌러 주세요.</p></div>\n    <div class="panel stack">\n      ${sec("홈 · 프로필", "가운데 동그란 사진과 이름, 그 아래 툴과 EXPERIENCE 부분이에요.")}\n      <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">\n        <div class="thumbs" id="s-pimg"></div>\n        <div><span class="lbl">프로필 이미지</span><input id="s-pfile" type="file" accept="image/*"><div class="hint">동그랗게 잘려서 보여요. 얼굴이 가운데 오는 정사각형 이미지가 좋아요.</div></div></div>\n      <div><label class="lbl" for="s-name">이름</label><input id="s-name" class="field" value="${esc(s.name || "")}"><div class="hint">프로필 이름, 왼쪽 위 로고, 맨 아래 © 에 쓰여요.</div></div>\n      <div><span class="lbl">분야 알약 <span class="hint" style="display:inline">(사진 둘레, 최대 4개)</span></span><div class="chips" id="s-fields"></div>\n        <div class="inline" style="margin-top:8px"><input id="s-newfield" class="field" placeholder="예: 3D" aria-label="새 분야"><button class="btn sm" id="s-addfield">추가</button></div></div>\n      <div><span class="lbl">사용 툴 <span class="hint" style="display:inline">(이름 아래 한 줄로 보여요)</span></span><div class="chips" id="s-tools"></div>\n        <div class="inline" style="margin-top:8px"><input id="s-newtool" class="field" placeholder="예: Blender" aria-label="새 툴"><button class="btn sm" id="s-addtool">추가</button></div></div>\n      <div><label class="lbl" for="s-intro">EXPERIENCE (경력)</label><textarea id="s-intro" class="field" rows="3">${esc(s.intro || "")}</textarea><div class="hint">한 줄에 하나씩 왼쪽부터 타임라인으로 보여요. 예: 키동부 2025.02 ~ · 지난 경력은 맨 앞에 - 를 붙이면 회색으로 보여요 (예: - Studio Leapy).</div></div>\n\n      ${sec("아이템", "")}\n      <div><label class="lbl" for="s-iintro">홈 아이템 소개 문구</label><textarea id="s-iintro" class="field" rows="2" placeholder="보유하고 있는 BOOTH 아이템 목록이에요.">${esc(s.items_intro ?? "")}</textarea><div class="hint">홈의 Items 부분 제목 옆에 보여요. 비우면 기본 문구가 보여요.</div></div>\n      <div><label class="lbl" for="s-notice">Items 페이지 안내 문구</label><textarea id="s-notice" class="field" rows="3">${esc(s.items_notice || "")}</textarea><div class="hint">Items 페이지 제목 오른쪽에 보여요.</div></div>\n\n      ${sec("하단 · CONTACT", "모든 페이지 맨 아래 검은 부분이에요.")}\n      <div><label class="lbl" for="s-ftitle">큰 문구</label><textarea id="s-ftitle" class="field" rows="2" placeholder="Let's make it&#10;count.">${esc(s.footer_title || "")}</textarea><div class="hint">줄바꿈한 곳에서 줄이 나뉘고, 끝의 마침표는 포인트 색이 돼요. 비우면 "Let's make it count."</div></div>\n      <div><label class="lbl" for="s-msg">소개 문구</label><textarea id="s-msg" class="field" rows="2">${esc(s.message || "")}</textarea><div class="hint">큰 문구 바로 아래에 보여요. 줄바꿈도 그대로 보여요.</div></div>\n      <div><label class="lbl" for="s-email">이메일</label><input id="s-email" class="field" type="email" value="${esc(s.email || "")}"><div class="hint">CONTACT 첫 번째 (분홍) 버튼이에요. 휴대폰에서는 아이콘만 보여요.</div></div>\n      <div><label class="lbl" for="s-discord">디스코드 아이디</label><input id="s-discord" class="field" value="${esc(s.discord || "")}" placeholder="예: leeepu_"><div class="hint">누르면 아이디가 복사돼요. 비우면 안 보여요.</div></div>\n      <div><span class="lbl">링크</span><div class="stack" style="gap:8px" id="s-links"></div><button class="btn sm" id="s-addlink" style="margin-top:8px">+ 링크 추가</button>\n        <div class="hint">X 주소는 X 아이콘과 @아이디로 자동 표시돼요. 그 밖의 링크는 라벨(비우면 주소)로 보여요.</div></div>\n\n      ${sec("전체", "")}\n      <div><label class="lbl" for="s-color">포인트 색</label><div style="display:flex;gap:10px;align-items:center"><input id="s-color" type="color" value="${esc(/^#[0-9a-f]{6}$/i.test(s.accent_color || "") ? s.accent_color : "#FF3D8B")}" style="width:56px;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:2px"><button class="btn sm" id="s-color0">기본값</button></div><div class="hint">제목의 점, 버튼, 카테고리 글자 색이에요.</div></div>\n      <div class="foot"><button class="btn primary" id="s-save">저장</button></div>\n    </div>\n    <div class="panel stack">\n      ${LOCAL ? `<div><span class="lbl">이 컴퓨터에서 편집 중</span><p class="sub" style="margin:0">바꾼 내용은 이 브라우저에 임시로 저장돼요. 사이트에 반영하려면 위의 <b>data.json 저장</b>으로 받은 파일을 사이트 폴더에 넣으세요.</p></div>\n      <div class="foot" style="justify-content:flex-start;flex-wrap:wrap"><button class="btn sm" id="s-export">data.json 저장</button><button class="btn sm danger" id="s-resetlocal">처음 상태로 되돌리기</button><button class="btn sm" id="s-togh">GitHub에 연결하기</button></div>` : `<div><span class="lbl">GitHub 연결</span><p class="sub" style="margin:0">${esc(C.owner)}/${esc(C.repo)} (${esc(C.branch)}) 에 저장하고 있어요.</p></div>\n      <div class="foot" style="justify-content:flex-start"><button class="btn sm" id="s-reload">GitHub에서 새로 불러오기</button><button class="btn sm danger" id="s-logout">이 브라우저에서 연결 해제</button></div>`}\n    </div></div>`;
    const parts = () => {
      $("s-pimg").innerHTML = `<div class="one" style="width:72px;height:72px;border-radius:18px">${imgTag(F.profile_image)}</div>`;
      $("s-fields").innerHTML = F.fields.map(((t, i) => `<span class="tag">${esc(t)}<button data-rfield="${i}" aria-label="${esc(t)} 빼기">×</button></span>`)).join("") || `<span class="hint">아직 없어요</span>`;
      $("s-tools").innerHTML = F.tools.map(((t, i) => `<span class="tag">${esc(t)}<button data-rtool="${i}" aria-label="${esc(t)} 빼기">×</button></span>`)).join("") || `<span class="hint">아직 없어요</span>`;
      $("s-links").innerHTML = F.links.map(((l, i) => `<div class="inline"><input class="field" style="max-width:130px" data-ll="${i}" value="${esc(l.label || "")}" placeholder="라벨" aria-label="링크 라벨"><input class="field" data-lu="${i}" value="${esc(l.url || "")}" placeholder="https://" aria-label="링크 주소"><button class="btn sm" data-rlink="${i}">빼기</button></div>`)).join("");
    };
    parts();
    $("page").onclick = e => {
      const rf = e.target.closest("[data-rfield]");
      if (rf) {
        F.fields.splice(+rf.dataset.rfield, 1);
        parts();
      }
      const rt = e.target.closest("[data-rtool]");
      if (rt) {
        F.tools.splice(+rt.dataset.rtool, 1);
        parts();
      }
      const rl = e.target.closest("[data-rlink]");
      if (rl) {
        F.links.splice(+rl.dataset.rlink, 1);
        parts();
      }
    };
    $("page").oninput = e => {
      const t = e.target;
      if (t.dataset.ll) F.links[+t.dataset.ll].label = t.value;
      if (t.dataset.lu) F.links[+t.dataset.lu].url = t.value;
    };
    $("s-addlink").onclick = () => {
      F.links.push({
        label: "",
        url: ""
      });
      parts();
    };
    $("s-addtool").onclick = () => {
      const v = $("s-newtool").value.trim();
      if (v && !F.tools.includes(v)) F.tools.push(v);
      $("s-newtool").value = "";
      parts();
    };
    $("s-addfield").onclick = () => {
      const v = $("s-newfield").value.trim();
      if (!v || F.fields.includes(v)) return;
      if (F.fields.length >= 4) return toast("분야 알약은 4개까지예요", true);
      F.fields.push(v);
      $("s-newfield").value = "";
      parts();
    };
    $("s-newfield").onkeydown = e => {
      if (e.key === "Enter") $("s-addfield").click();
    };
    $("s-newtool").onkeydown = e => {
      if (e.key === "Enter") $("s-addtool").click();
    };
    $("s-color0").onclick = () => {
      $("s-color").value = "#FF3D8B";
    };
    $("s-pfile").onchange = guard((async () => {
      const f = $("s-pfile").files[0];
      $("s-pfile").value = "";
      if (!f) return;
      busy("파일 준비하는 중…");
      try {
        F.profile_image = await prepFile(f, "img");
      } finally {
        busy(false);
      }
      parts();
    }));
    if ($("s-reload")) $("s-reload").onclick = reload;
    if ($("s-export")) $("s-export").onclick = exportData;
    if ($("s-togh")) $("s-togh").onclick = () => {
      LOCAL = false;
      $("h-export").hidden = true;
      markDirty();
      connectView();
    };
    if ($("s-resetlocal")) $("s-resetlocal").onclick = async () => {
      if (!await ask("편집한 내용을 모두 버리고 이 파일의 원래 내용으로 돌아갈까요?", "되돌리기")) return;
      try {
        localStorage.removeItem(LKEY);
      } catch (e) {}
      DIRTY = false;
      startLocal(JSON.parse(JSON.stringify(window.SITE_DATA || D)));
    };
    if ($("s-logout")) $("s-logout").onclick = async () => {
      if (!await ask("이 브라우저에서 GitHub 연결을 해제할까요? 사이트 내용은 그대로예요.", "해제")) return;
      store.clear();
      C = {
        ...C,
        token: ""
      };
      D = null;
      connectView();
    };
    $("s-save").onclick = guard((async () => {
      const name = $("s-name").value.trim();
      if (!name) return toast("이름을 입력해 주세요", true);
      const site = {
        name: name,
        intro: $("s-intro").value.trim(),
        email: $("s-email").value.trim(),
        discord: $("s-discord").value.trim(),
        profile_image: F.profile_image,
        links: F.links.filter((l => l.url.trim())).map((l => ({
          label: l.label.trim(),
          url: l.url.trim()
        }))),
        tools: F.tools,
        accent_color: $("s-color").value,
        items_notice: $("s-notice").value.trim(),
        message: $("s-msg").value.trim(),
        fields: F.fields,
        footer_title: $("s-ftitle").value.trim(),
        items_intro: $("s-iintro").value.trim()
      };
      if (!site.footer_title) delete site.footer_title;
      if (!site.items_intro) delete site.items_intro;
      await commit("설정 수정", (d => {
        const keep = {
          ...d.site
        };
        delete keep.footer_title;
        delete keep.items_intro;
        d.site = {
          ...keep,
          ...site
        };
      }), filesFor([ site.profile_image ]));
      toast(savedMsg());
      show("settings");
    }));
  }
  boot();
})();
</script>
</body>
</html>
